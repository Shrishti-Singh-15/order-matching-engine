# Activate with: --spring.profiles.active=postgres
# Requires a running PostgreSQL instance matching these settings
# (see docker-compose.yml for a ready-to-use local instance).

spring.datasource.url=jdbc:postgresql://localhost:5432/order_matching
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
