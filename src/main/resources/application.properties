# Default profile: in-memory H2, so the app runs immediately with no setup.
# Use the "postgres" profile (see application-postgres.properties) for a
# PostgreSQL-backed run, which is how this project is intended to run in
# a real deployment.

spring.application.name=order-matching-engine

spring.datasource.url=jdbc:h2:mem:orderbook;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
